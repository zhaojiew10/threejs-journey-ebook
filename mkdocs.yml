site_name: Three.js 从入门到实战
site_description: 从 WebGL 与 Three.js 基础到 GLSL、Blender 和 React Three Fiber 实战，共 6 个部分、45 章
site_author: Three.js Journey 课程学习笔记
site_url: https://zhaojiew10.github.io/threejs-journey-ebook/
repo_url: https://github.com/zhaojiew10/threejs-journey-ebook
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
    - scheme: slate
      primary: blue grey
      accent: cyan

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - tables
  - def_list
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - 电子书首页: index.md
  - "第一部分 · Three.js 基础":
      - "第 1 章 课程导论与 WebGL 基础": chapters/ch01.md
