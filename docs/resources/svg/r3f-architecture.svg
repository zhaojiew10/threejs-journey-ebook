<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">React Three Fiber 的声明式渲染关系</title>
  <desc id="desc">React 组件通过 R3F 协调器创建 Three.js 对象，Canvas 提供渲染循环，Drei 提供常用抽象</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#52788a"/></marker><style>.box{fill:#fff;stroke:#96b4c1;stroke-width:2}.stage{fill:#eaf7f8;stroke:#3ca0b0;stroke-width:2}.data{fill:#f8f3e9;stroke:#c7a768;stroke-width:2}.arrow{fill:none;stroke:#52788a;stroke-width:2.5;marker-end:url(#a)}.dash{stroke-dasharray:7 6}.title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#173444}.label{font:600 21px 'Microsoft YaHei',sans-serif;fill:#173444}.code{font:17px Consolas,monospace;fill:#405d6a}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#526c78}</style></defs>
  <rect width="1200" height="650" rx="18" fill="#f6f9fb"/>
  <text class="title" x="600" y="54" text-anchor="middle">React Three Fiber：用组件描述 Three.js 场景</text>
  <g>
    <rect class="box" x="55" y="115" width="260" height="150" rx="14"/><text class="label" x="185" y="157" text-anchor="middle">React 组件树</text><text class="code" x="100" y="198">&lt;Canvas&gt;</text><text class="code" x="112" y="226">&lt;mesh&gt;…&lt;/mesh&gt;</text><text class="code" x="100" y="251">&lt;/Canvas&gt;</text>
    <rect class="stage" x="470" y="115" width="260" height="150" rx="14"/><text class="label" x="600" y="157" text-anchor="middle">R3F Reconciler</text><text class="small" x="600" y="194" text-anchor="middle">将 JSX 映射为 Three.js 对象</text><text class="small" x="600" y="226" text-anchor="middle">协调属性更新与生命周期</text>
    <rect class="box" x="885" y="115" width="260" height="150" rx="14"/><text class="label" x="1015" y="157" text-anchor="middle">Three.js Scene</text><text class="small" x="1015" y="194" text-anchor="middle">Scene · Mesh · Camera</text><text class="small" x="1015" y="226" text-anchor="middle">WebGLRenderer 渲染画面</text>
    <path class="arrow" d="M315 190H460"/><path class="arrow" d="M730 190H875"/>
  </g>
  <g>
    <rect class="data" x="55" y="375" width="260" height="125" rx="14"/><text class="label" x="185" y="417" text-anchor="middle">Hooks</text><text class="small" x="185" y="451" text-anchor="middle">useFrame · useThree</text><text class="small" x="185" y="479" text-anchor="middle">useLoader · useGesture</text>
    <rect class="data" x="470" y="375" width="260" height="125" rx="14"/><text class="label" x="600" y="417" text-anchor="middle">Drei</text><text class="small" x="600" y="451" text-anchor="middle">常用组件与辅助抽象</text><text class="small" x="600" y="479" text-anchor="middle">Controls · Environment · Text</text>
    <rect class="box" x="885" y="375" width="260" height="125" rx="14"/><text class="label" x="1015" y="417" text-anchor="middle">React 状态管理</text><text class="small" x="1015" y="451" text-anchor="middle">UI 与场景共享应用状态</text><text class="small" x="1015" y="479" text-anchor="middle">避免不必要的高频重渲染</text>
    <path class="arrow dash" d="M315 437H470"/><path class="arrow dash" d="M600 375V275"/><path class="arrow dash" d="M885 437H790V275"/>
  </g>
  <text class="small" x="600" y="580" text-anchor="middle">R3F 不是另一套 3D 引擎，而是 Three.js 与 React 之间的声明式桥接层</text>
</svg>
